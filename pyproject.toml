[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiops-investigator"
version = "1.0.0"
description = "An AI on-call engineer: investigates alerts with read-only tools and proposes fixes that need a person's approval."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Samiul Huda" }]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "mcp>=2.3,<3",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.17", "mypy>=1.10"]

[project.scripts]
aiops = "aiops.cli:main"

[tool.setuptools]
packages = ["aiops", "aiops.sim"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"aiops/sim/scenarios.py" = ["E501"]
"aiops/web.py" = ["E501"]
"aiops/tools.py" = ["E501"]
"aiops/report.py" = ["E501"]
"aiops/cli.py" = ["E501"]
"eval/*.py" = ["E501"]
"tests/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["aiops", "eval", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
